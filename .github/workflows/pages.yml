name: Deploy research site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static research site
        run: |
          mkdir -p _site
          cp -R web 资料库 docs index.html .nojekyll WechatIMG85.jpg _site/
          python3 - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          for asset in json.loads(Path('asset-manifest.json').read_text()):
              chunks = sorted(Path('_asset_chunks').glob(asset['id'] + '-*/*.b64'))
              data = base64.b64decode(''.join(p.read_text() for p in chunks), validate=True)
              assert hashlib.sha256(data).hexdigest() == asset['sha256'], asset['path']
              target = Path('_site') / asset['path']
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          PY
          test -f _site/index.html
          test -f _site/web/industry.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
